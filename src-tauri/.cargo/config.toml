[env]
# Trims the bundled SQLite (rusqlite "bundled") to what Ferrite Notes uses.
# -U removes a feature libsqlite3-sys turns on by default; we only need FTS5.
# The rest are from SQLite's "recommended compile-time options"
# (https://sqlite.org/compile.html#rcmd): smaller and slightly faster.
LIBSQLITE3_FLAGS = """\
  -USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_RTREE \
  -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_STAT4 -USQLITE_SOUNDEX \
  -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_ENABLE_LOAD_EXTENSION \
  SQLITE_OMIT_LOAD_EXTENSION SQLITE_OMIT_JSON SQLITE_OMIT_DEPRECATED \
  SQLITE_OMIT_SHARED_CACHE SQLITE_OMIT_PROGRESS_CALLBACK SQLITE_DQS=0 \
  SQLITE_DEFAULT_MEMSTATUS=0 SQLITE_DEFAULT_WAL_SYNCHRONOUS=1 \
  SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_MAX_EXPR_DEPTH=0 SQLITE_USE_ALLOCA\
"""
