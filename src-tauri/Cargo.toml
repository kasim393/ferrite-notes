[package]
name = "ferrite-notes"
version = "0.1.1"
description = "Fast, light, offline-first notes with tasks, search and optional self-hosted sync"
authors = ["Kasim"]
license = "MIT"
repository = "https://github.com/kasim393/ferrite-notes"
edition = "2021"

[lib]
name = "ferrite_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Pure-Rust deflate backend for `zip`.
flate2 = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Android has no system root store reqwest can reach without JNI setup, so
# sync there trusts the bundled Mozilla roots instead.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
# Export: the system "Save as" picker and writing to the content:// it returns.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
