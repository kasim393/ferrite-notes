name: Feature idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: The problem or situation first; then your idea for solving it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: markdown
    attributes:
      value: Ferrite Notes tries to stay fast, small and simple, so ideas that fit that tend to land first.
