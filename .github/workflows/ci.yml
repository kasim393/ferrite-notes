# Checks every push to main and every pull request: types, tests and lint for the app
# (Rust + Svelte) and the sync server (Worker).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Rust + Svelte)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check the frontend
        run: npm run check

      # The Rust crate embeds the built frontend, so build it first.
      - name: Build the frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  worker:
    name: Sync server (Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
